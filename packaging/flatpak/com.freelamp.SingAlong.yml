# Flatpak manifest for Sing-Along.
#
# Builds the app from the published .deb instead of from source. Compiling a
# Tauri application inside the sandbox means building webkit2gtk, a Rust toolchain
# and the full node dependency tree in the Flatpak SDK: hours of build for a binary
# CI has already produced and tested on this exact platform.
#
# The .deb is a Debian archive, not a tarball, so it is unpacked in two steps —
# `ar` for the container, then `tar` for the payload — rather than being handed to
# Flatpak as a source with `strip-components`, which only understands tarballs.

app-id: com.freelamp.SingAlong
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: sing-along

finish-args:
  # The library is wherever the user keeps their music, and lyrics are written
  # back next to those files or into their tags — so the app needs the same view
  # of the filesystem the user has. `--filesystem=home` is what Flathub rejects as
  # too broad, so the two directories that actually hold music are listed and the
  # file chooser portal covers the rest: picking a folder through it grants access
  # for the session without a permanent hole.
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # LRCLIB and NetEase.
  - --share=network
  - --socket=pulseaudio
  # Tray icon. The portals need no talk-name: the sandbox exposes them already.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: sing-along
    buildsystem: simple
    build-commands:
      # Unpack the Debian archive: `ar` holds control.tar.* and data.tar.*, and
      # only the latter is the payload. The extension is not fixed — dpkg-bundled
      # archives use gz, xz or zst depending on the toolchain that made them — so
      # the member is found by name rather than assumed.
      - ar x sing-along.deb
      - tar -xf "$(basename data.tar.*)"
      # The payload is already laid out as usr/... so it maps onto the prefix.
      - cp -r usr/* /app/
      # Flathub requires the desktop file and the metainfo file to be named after
      # the app id. The payload names them after the product, so they are moved
      # rather than copied — leaving the originals in place would ship two desktop
      # entries for one application, which the linter rejects.
      - mv /app/share/applications/Sing-Along.desktop /app/share/applications/com.freelamp.SingAlong.desktop
      - mv /app/share/metainfo/sing-along.metainfo.xml /app/share/metainfo/com.freelamp.SingAlong.metainfo.xml
      # The icon is named after the app id, as Flathub requires, and the desktop
      # file's `Icon=` is changed to match. Leaving it as `sing-along` — the name
      # the .deb uses — makes appstreamcli report `gui-app-without-icon` and refuse
      # to produce any metadata at all, which fails the build at the last step.
      - for size in 32x32 128x128 256x256@2; do install -Dm644 "usr/share/icons/hicolor/${size}/apps/sing-along.png" "/app/share/icons/hicolor/${size}/apps/com.freelamp.SingAlong.png"; rm -f "/app/share/icons/hicolor/${size}/apps/sing-along.png"; done
      # One line: a trailing backslash would make the YAML pass a second
      # argument with a leading space, and sed would then look for a file named
      # " /app/..." that does not exist.
      - sed -i 's/^Icon=.*/Icon=com.freelamp.SingAlong/' /app/share/applications/com.freelamp.SingAlong.desktop
    # This is the source Flathub uses. It names a published release, so it goes
    # stale with every version — update the three values below when submitting an
    # update, before opening the PR.
    #
    # CI does not use them: the build job rewrites this source to point at the .deb
    # produced by the same run, because a tag build has not published its assets at
    # the point the check runs.
    sources:
      - type: file
        url: https://github.com/LeisureLinux/Sing-Along/releases/download/v2.9.34/sing-along_2.9.34_amd64.deb
        sha256: 8f76a8788391d2a7d10d6f962ff53f8f8b70b6d0beb09296458696087b53a249
        dest-filename: sing-along.deb
