name: 'release'

# Triggered by a version tag, not by a branch. A release is a deliberate act:
# pushing v* is the signal, and the tag is what the assets get attached to.
on:
  push:
    tags:
      - 'v*'
  # Allow building the matrix without publishing, for checking that every
  # platform still compiles before cutting a tag.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # The upstream workflow pinned libwebkit2gtk to a specific version that
      # only existed on one runner image; that breaks as soon as the image moves.
      # The app needs webkit2gtk-4.1 and ALSA, nothing more specific.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      # `npm install`, not `npm ci`.
      #
      # The lockfile can only record optional platform binaries for the machine
      # that generated it — here it holds `@tauri-apps/cli-linux-x64-*` but not
      # the darwin or win32 equivalents — so `npm ci` correctly reports them as
      # missing on the macOS and Windows runners. Upstream used `npm install`
      # for the same reason. The lockfile still pins versions, just without the
      # strict all-or-nothing check.
      - name: install frontend dependencies
        run: npm install

      - name: run frontend tests
        run: npm test

      # `dist/` must exist before any backend build: tauri.conf.json points
      # `frontendDist` at it, and tauri-build fails the crate when the path is
      # missing. So the frontend is built first and the Rust tests run after.
      - name: build frontend
        run: npm run build

      - name: run backend tests
        working-directory: src-tauri
        run: cargo test

      # `tauri-action` locates the bundle artifacts and uploads them itself, so the
      # unwanted files are removed from the bundle directory before it runs. The
      # `.app.tar.gz` a macOS build emits is the payload for Tauri's auto-updater,
      # which this project does not use: there is no updater plugin, no signing
      # key, and `createUpdaterArtifacts` is false. It is produced unconditionally
      # regardless of that setting, after the `.dmg` is already complete, so
      # deleting it here cannot affect the `.dmg`.
      #
      # If auto-update is ever wired up, delete this step — those archives become
      # the update payload, together with their `.sig` files.
      - name: drop macOS updater archives (unused)
        if: matrix.platform == 'macos-latest'
        run: |
          find src-tauri/target -name "*.app.tar.gz" -delete
          find src-tauri/target -name "*.app.tar.gz.sig" -delete

          # Assert the .dmg survived: if this step ever starts eating the real
          # bundle, the build should fail loudly rather than publish nothing.
          dmg_count=$(find src-tauri/target -name "*.dmg" | wc -l)
          echo "remaining .dmg files: $dmg_count"
          test "$dmg_count" -ge 1 || { echo "::error::no .dmg left after cleanup"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The tag is created by this workflow when it does not exist yet, and
          # reused when it does, so re-running a failed release does not produce
          # a duplicate.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Sing-Along __VERSION__'
          releaseBody: |
            Synced lyrics tool for your own music files.

            See the assets below to download and install. Linux users can take the
            `.deb`, `.rpm` or AppImage; Windows the setup `.exe` or `.msi`; macOS the
            `.dmg` for your architecture.

            Full changelog: https://github.com/LeisureLinux/Sing-Along/commits/main
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
