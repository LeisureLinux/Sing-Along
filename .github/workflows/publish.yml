name: 'release'

# Triggered by a version tag, not by a branch. A release is a deliberate act:
# pushing v* is the signal, and the tag is what the assets get attached to.
on:
  push:
    tags:
      - 'v*'
  # Allow building the matrix without publishing, for checking that every
  # platform still compiles before cutting a tag.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform names exactly the installers it should ship. This keeps
          # the release page's contents explicit rather than depending on what
          # `"all"` happens to include on a given runner image.
          #
          # Note this alone does not control the macOS `.app.tar.gz`: the updater
          # archives are requested by `tauri-action` via `includeUpdaterJson`, not
          # by the target list. See the action's `with:` block below.
          # Apple Silicon only. Intel Macs are not built: Apple has stopped
          # shipping new Intel hardware and macOS support for it is winding down,
          # so maintaining a second macOS job doubles the slowest leg of the
          # matrix for a shrinking audience. Re-add
          # `--target x86_64-apple-darwin` here if that changes.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the target actually being built: installing an extra Rust
          # target costs a download and gains nothing when the matrix no longer
          # builds for it.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # The upstream workflow pinned libwebkit2gtk to a specific version that
      # only existed on one runner image; that breaks as soon as the image moves.
      # The app needs webkit2gtk-4.1 and ALSA, nothing more specific.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      # `npm install`, not `npm ci`.
      #
      # The lockfile can only record optional platform binaries for the machine
      # that generated it — here it holds `@tauri-apps/cli-linux-x64-*` but not
      # the darwin or win32 equivalents — so `npm ci` correctly reports them as
      # missing on the macOS and Windows runners. Upstream used `npm install`
      # for the same reason. The lockfile still pins versions, just without the
      # strict all-or-nothing check.
      - name: install frontend dependencies
        run: npm install

      - name: run frontend tests
        run: npm test

      # `dist/` must exist before any backend build: tauri.conf.json points
      # `frontendDist` at it, and tauri-build fails the crate when the path is
      # missing. So the frontend is built first and the Rust tests run after.
      - name: build frontend
        run: npm run build

      - name: run backend tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The tag is created by this workflow when it does not exist yet, and
          # reused when it does, so re-running a failed release does not produce
          # a duplicate.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Sing-Along __VERSION__'
          releaseBody: |
            Synced lyrics tool for your own music files.

            See the assets below to download and install.

            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE), or the
              `.AppImage` which runs on most distributions.
            - **Windows**: `-setup.exe` to install, `.msi` for managed deployment.
            - **macOS**: the `.dmg` builds are Apple Silicon only (M1 and later).
              Intel Macs are not built.

            Full changelog: https://github.com/LeisureLinux/Sing-Along/commits/main
          # Published straight away rather than left as a draft. The tests run
          # before bundling, so a release only exists if the build was green; the
          # earlier "draft" setting meant a successful build still needed a manual
          # publish step, which was easy to forget and left the project page
          # showing the previous version.
          releaseDraft: false
          prerelease: false
          # The action defaults this to true, which makes it write a `latest.json`
          # describing where to fetch an update. This project has no updater, so
          # that JSON would point at an update path no client can follow.
          #
          # Note the parameter is `includeUpdaterJson`, not `uploadUpdaterJson` —
          # the action only warns about unknown inputs and silently keeps the
          # default, which is how the first attempt at this quietly did nothing.
          includeUpdaterJson: false
          args: ${{ matrix.args }}
