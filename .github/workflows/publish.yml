name: 'release'

# Triggered by a version tag, not by a branch. A release is a deliberate act:
# pushing v* is the signal, and the tag is what the assets get attached to.
on:
  push:
    tags:
      - 'v*'
  # Allow building the matrix without publishing, for checking that every
  # platform still compiles before cutting a tag.
  workflow_dispatch:

jobs:
  # Created once, before any build starts.
  #
  # `tauri-action` creates the release if it is missing, and every matrix job
  # checks independently — so two of them can both find it absent and race to
  # create it. The loser fails with `already_exists`, taking its assets with it
  # (v2.9.11 lost the macOS dmg that way). Creating it up front makes the
  # question moot: each job finds it and only uploads.
  # Lint the workflow before anything expensive runs.
  #
  # Every failure in the last four releases was a mistake in this file that only
  # showed up after a full matrix build: a duplicated `permissions:` key, a
  # missing function, a step that assumed a release existed. `actionlint` catches
  # the first class in under a second.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check the workflow file
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  prepare-release:
    needs: lint
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists"
            exit 0
          fi
          printf '%s\n' \
            "The installers and the standalone command line are below." \
            "" \
            "For an AI agent or a script, download one of the singalong-cli-* files." \
            "" \
            "Changelog: https://github.com/LeisureLinux/Sing-Along/commits/main" \
            > notes.md
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "sing-along ${{ github.ref_name }}" \
            --notes-file notes.md

  build:
    needs: prepare-release
    permissions:
      contents: write
    outputs:
      windows-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform names exactly the installers it should ship, so the
          # release page does not depend on what `"all"` happens to include on a
          # given runner image.
          #
          # Apple Silicon only. Intel Macs are not built: Apple has stopped
          # shipping new Intel hardware and macOS support for it is winding down,
          # so a second macOS job doubles the slowest leg of the matrix for a
          # shrinking audience. Add `--target x86_64-apple-darwin` here if that
          # changes.
          #
          # Note this list alone does not control the macOS `.app.tar.gz`: the
          # updater archives are requested by `tauri-action` via
          # `uploadUpdaterJson`, not by the target list.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'
          - platform: 'windows-latest'
            # NSIS only. The .msi exists for GPO/Intune deployment, and this
            # project has no managed-deployment audience; dropping it removes a
            # 15 MB asset per release. The installer offers per-user (no admin
            # rights needed) or per-machine at install time.
            args: '--bundles nsis'
          # Not a GUI platform: this runner exists only to build the static
          # arm64 CLI. Cross-compiling it from x86_64 would need a musl-targeted
          # aarch64 compiler, which Debian does not package — an ARM runner has
          # one natively.
          - platform: 'ubuntu-24.04-arm'
            args: ''
            cli_only: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the target actually being built: an extra Rust target costs a
          # download and gains nothing on the other platforms.
          targets: >-
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin'
             || matrix.platform == 'ubuntu-24.04-arm' && 'aarch64-unknown-linux-musl'
             || '' }}

      # The upstream workflow pinned libwebkit2gtk to a specific version that
      # only existed on one runner image; that breaks as soon as the image moves.
      # The app needs webkit2gtk-4.1 and ALSA, nothing more specific.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      # `npm install`, not `npm ci`.
      #
      # The lockfile can only record optional platform binaries for the machine
      # that generated it — here it holds `@tauri-apps/cli-linux-x64-*` but not
      # the darwin or win32 equivalents — so `npm ci` correctly reports them as
      # missing on the macOS and Windows runners. Upstream used `npm install`
      # for the same reason. The lockfile still pins versions, just without the
      # strict all-or-nothing check.
      - name: install frontend dependencies
        if: ${{ !matrix.cli_only }}
        run: npm install

      - name: run frontend tests
        if: ${{ !matrix.cli_only }}
        run: npm test

      # `dist/` must exist before any backend build: tauri.conf.json points
      # `frontendDist` at it, and tauri-build fails the crate when the path is
      # missing. So the frontend is built first and the Rust tests run after.
      - name: build frontend
        if: ${{ !matrix.cli_only }}
        run: npm run build

      - name: run backend tests
        if: ${{ !matrix.cli_only }}
        working-directory: src-tauri
        run: cargo test

      # `cargo test` builds with the default features only (gui + cli). The
      # standalone CLI is compiled with `--no-default-features --features cli`,
      # a different cfg combination — a reference to a function that only exists
      # under the GUI build passes the tests and fails there. v2.9.9 shipped
      # nothing because of exactly that.
      - name: check the cli-only build compiles
        if: ${{ !matrix.cli_only }}
        working-directory: src-tauri
        run: cargo check --no-default-features --features cli

      # Pinned to v1 rather than the v0 floating tag: `releaseAssetNamePattern`
      # does not exist in v0's action.yml, and an unknown input is ignored with
      # only a warning — the release then ships Tauri's default filename and
      # looks like the pattern was wrong.
      # Headless build: same code, no window, linked statically so it runs on a
      # machine with no GTK/WebKit/ALSA at all. Separate from the GUI because the
      # two have opposite constraints — the GUI must link a webview, this must not.
      #
      # Windows gets a static CRT build for the same reason. macOS is absent
      # deliberately: Apple does not support fully static linking.
      # Two architectures, both fully static. amd64 uses the distro's musl-tools;
      # arm64 needs a toolchain Debian does not package, so `cross` supplies one
      # from a container image. Doing it by hand means downloading a GCC build
      # from a third-party mirror and pinning it, which is worse than a maintained
      # image for the one target that needs it.
      #
      # `ring` compiles C, which is why a plain `rustup target add` is not enough:
      # without a musl-targeted compiler the build stops with
      # `failed to find tool "x86_64-linux-musl-gcc"`.
      - name: build cli (linux amd64, static)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --no-default-features --features cli \
            --target x86_64-unknown-linux-musl --bin singalong-cli
          strip target/x86_64-unknown-linux-musl/release/singalong-cli
          cp target/x86_64-unknown-linux-musl/release/singalong-cli \
            singalong-cli-linux-amd64
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: cli-linux-amd64
          path: src-tauri/singalong-cli-linux-amd64

      - name: build cli (linux arm64, static)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --no-default-features --features cli \
            --target aarch64-unknown-linux-musl --bin singalong-cli
          strip target/aarch64-unknown-linux-musl/release/singalong-cli
          cp target/aarch64-unknown-linux-musl/release/singalong-cli \
            singalong-cli-linux-arm64
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-24.04-arm'
        with:
          name: cli-linux-arm64
          path: src-tauri/singalong-cli-linux-arm64

      # macOS cannot be linked statically, but the CLI is still worth shipping
      # separately: it is the binary an agent downloads, and it is a fraction of
      # the .dmg. It links the system frameworks like any macOS binary.
      - name: build cli (macos)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release --no-default-features --features cli \
            --target aarch64-apple-darwin --bin singalong-cli
          cp target/aarch64-apple-darwin/release/singalong-cli \
            singalong-cli-macos-arm64
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-latest'
        with:
          name: cli-macos-arm64
          path: src-tauri/singalong-cli-macos-arm64

      # Windows has no fully static linking, but `+crt-static` removes the
      # dependency that actually bites: the Visual C++ runtime
      # (vcruntime140.dll / msvcp140.dll), which is a separate download on a
      # clean machine. What remains are Windows system DLLs (kernel32, ws2_32,
      # bcrypt, …), which every Windows install already has — so the result is
      # as self-contained as a Windows binary gets.
      - name: build cli (windows)
        if: matrix.platform == 'windows-latest'
        # `shell: bash` rather than PowerShell: `copy` and backtick line
        # continuations are PowerShell only, and a workflow that mixes them with
        # bash conventions in every other step cannot be linted. Git for Windows
        # provides bash on the runner.
        shell: bash
        run: |
          cargo build --release --no-default-features --features cli \
            --target x86_64-pc-windows-msvc --bin singalong-cli
          cp target/x86_64-pc-windows-msvc/release/singalong-cli.exe \
            singalong-cli-windows-amd64.exe
        working-directory: src-tauri
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      # Windows builds with the CLI rather than `tauri-action` when signing is
      # configured: that action builds and publishes in one motion, which would
      # put the unsigned installer on the release page before SignPath could
      # sign it. Without signing configured there is nothing to wait for, so the
      # normal path is used — a fork, or this repository before SignPath
      # approval, still releases.
      - name: build the windows installer (unsigned)
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        run: npx tauri build --bundles nsis
        env:
          # Signing happens in the `sign-windows` job; this must not try.
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: upload windows artifacts for signing
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/singalong-cli-windows-amd64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: cli-windows-amd64
          path: src-tauri/singalong-cli-windows-amd64.exe

      - uses: tauri-apps/tauri-action@v1
        if: ${{ !matrix.cli_only && (matrix.platform != 'windows-latest' || vars.SIGNPATH_ENABLED != 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The tag is created by this workflow when it does not exist yet, and
          # reused when it does, so re-running a failed release does not produce
          # a duplicate.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'sing-along v__VERSION__'
          releaseBody: |
            Synced lyrics for your own music files.

            ### For an AI agent or a script

            Download **one** file, `chmod +x`, and run it. No install, no
            dependencies:

            | Your platform | File |
            | --- | --- |
            | Linux x86_64 | `singalong-cli-linux-amd64` |
            | Linux arm64 | `singalong-cli-linux-arm64` |
            | macOS (Apple Silicon) | `singalong-cli-macos-arm64` |
            | Windows x86_64 | `singalong-cli-windows-amd64.exe` |

            These are the command line only — they never open a window, and both
            Linux builds are statically linked so they run on a machine with no
            GTK or WebKit at all.

            ```
            singalong-cli-linux-amd64 status ~/Music
            singalong-cli-linux-amd64 fetch ~/Music
            singalong-cli-linux-amd64 export ~/Music --for steve
            ```

            Do **not** download the `.deb`, `.rpm` or `.AppImage` to get a CLI:
            those are the desktop player, which needs WebKitGTK installed to run.
            Its binary does accept the same subcommands once installed.

            ### For a person

            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE), or the
              `.AppImage` which needs no installation.
            - **Windows**: `-setup.exe` to install. It asks whether to install
              for the current user (no administrator rights needed) or for all
              users.
            - **macOS**: the `.dmg` is Apple Silicon only (M1 and later).

            The Linux, Windows and macOS installers are not code-signed, so the
            system will warn on first launch — see
            https://github.com/LeisureLinux/Sing-Along#if-the-installer-is-blocked

          # Published straight away rather than left as a draft. The tests run
          # before bundling, so a release only exists if the build was green; the
          # earlier "draft" setting meant a successful build still needed a manual
          # publish step, which was easy to forget and left the project page
          # showing the previous version.
          releaseDraft: false
          prerelease: false
          # The action defaults this to true, which makes it write a `latest.json`
          # describing where to fetch an update. This project has no updater, so
          # that JSON would point at an update path no client can follow.
          #
          # The input was renamed `includeUpdaterJson` -> `uploadUpdaterJson` in
          # v1; getting it wrong is silent (unknown inputs only warn and the
          # default is kept), so it is worth re-checking after any action bump.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
          # One asset, one predictable name: `sing-along_2.5.7_amd64.deb`.
          # Tauri's default is `Sing-Along_2.5.4_amd64.deb`; only the product
          # name differs (capital, no underscore before the version), which
          # reads badly in a URL.
          #
          # `[mainBinaryName]` is `sing-along` from tauri.conf.json (not
          # `[name]`, which is the product name "Sing-Along"). On Linux `[arch]`
          # renders as the Debian architecture, `amd64` on this runner.
          #
          # No dot before `[ext]`: that variable already carries one (`.deb`),
          # so `.[ext]` would render `sing-along_2.5.7_amd64..deb`.
          releaseAssetNamePattern: '[mainBinaryName]_[version]_[arch][ext]'

      # Attached separately: `tauri-action` only uploads what it built itself,
      # and its naming pattern would produce `sing-along_...` rather than the
      # standalone name this binary ships under.

  # A single job attaches every standalone CLI, after all builds have finished.
  #
  # Doing it per platform raced: the arm64 job builds only a CLI, so it finishes
  # long before the three GUI jobs have created the release, and
  # `gh release upload` then fails with "release not found". v2.9.10 lost its
  # arm64 asset to exactly that. Waiting here — where the release already exists
  # because tauri-action created it — removes the ordering problem entirely.
  # Sign the Windows installer before it is published.
  #
  # SignPath Foundation issues a free Authenticode certificate to open source
  # projects and holds the private key in an HSM, so signing is a request to their
  # service rather than something done on the runner. That is why this is a
  # separate job: the artifact must exist before it can be submitted.
  #
  # Skipped when the secret is absent, so a fork without the setup still
  # releases — unsigned, which is what it would have done anyway.
  sign-windows:
    needs: build
    if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: windows-unsigned
          path: unsigned

      - name: sign the installer and CLI
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          # The id of the uploaded artifact, not a path: SignPath fetches the file
          # from GitHub itself, so what it signs is byte-for-byte what was built.
          github-artifact-id: ${{ needs.build.outputs.windows-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: signed/

  # Attach the signed Windows files to the release.
  #
  # Only Windows goes through here: the other platforms publish from their own
  # build job, and rebuilding that flow would be a change with no benefit. The
  # point is that the installer reaching the release page has already been signed.
  publish-windows:
    needs: [prepare-release, sign-windows]
    if: always() && github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: signed

      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l signed
          # Only the installer and CLI; SignPath may also return a signature
          # file, which no one downloads.
          find signed -type f \( -name '*.exe' \) -exec \
            gh release upload "${{ github.ref_name }}" {} \
            --clobber --repo "${{ github.repository }}" \;

  collect-cli:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: attach the standalone CLIs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # The release is created by tauri-action inside a GUI job. If every
          # GUI job failed while the CLI builds succeeded, there is nothing to
          # attach to yet — create it here rather than failing on a missing tag.
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "sing-along ${{ github.ref_name }}" \
              --notes "See the assets below."
          fi
          gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
